name: CI Practice Pipeline

on:
  push:
    branches: [ API-Testing ]
  pull_request:
    branches: [ API-Testing ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm init -y && npm install jest supertest @playwright/test

    - name: Run Automated Tests
      run: npx jest
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run UI Tests
      run: npx playwright test
