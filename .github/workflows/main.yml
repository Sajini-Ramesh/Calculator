name: CI Practice Pipeline

on:
  push:
    branches: [ API-Testing ]
  pull_request:
    branches: [ API-Testing ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Using a standard Linux environment for stability

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 2. Install all necessary testing tools
    - name: Install dependencies
      run: |
        npm init -y
        npm install jest supertest @playwright/test

    # 3. Specifically install Playwright browsers and system dependencies
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 4. Run Jest tests specifically from the jest-tests folder
    - name: Run Unit & API Tests (Jest)
      run: npx jest jest-tests/
      # 5. Run UI tests specifically from the e2e-tests folder
    - name: Run Web UI Tests (Playwright)
      run: npx playwright test e2e-tests/
